<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Country Form Editor</title>

    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --border: #e5e7eb;
        --primary: #2563eb;
        --text: #111827;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ===== TOPBAR ===== */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }

      .topbar input[type="file"] {
        display: none;
      }

      .topbar button,
      .country-tab {
        border: 1px solid var(--border);
        background: white;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }

      .topbar button:hover,
      .country-tab:hover {
        background: #f0f4ff;
      }

      .country-tab.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .country-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-left: 10px;
      }

      /* ===== MAIN LAYOUT ===== */
      .container {
        flex: 1;
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 14px;
        padding: 14px;
        overflow: hidden;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        overflow-y: auto;
      }

      /* ===== FORM ===== */
      h2 {
        margin-top: 0;
      }

      fieldset {
        border: none;
        margin-bottom: 16px;
      }

      legend {
        font-weight: 600;
        margin-bottom: 8px;
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 8px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      input {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .array-item {
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }

      .preview-img {
        width: 100%;
        max-height: 140px;
        object-fit: contain;
        border-radius: 8px;
        margin-top: 6px;
        border: 1px solid var(--border);
      }

      /* ===== BUTTONS ===== */
      .btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 13px;
      }

      .btn.secondary {
        background: white;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn.danger {
        background: #ef4444;
      }

      .btn.small {
        font-size: 12px;
        padding: 4px 8px;
      }

      /* ===== PREVIEW ===== */
      pre {
        font-size: 12px;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        overflow-x: auto;
      }
    </style>
  </head>

  <body>
    <!-- TOPBAR -->
    <div class="topbar">
      <label class="btn secondary">
        📂 Laden
        <input type="file" accept=".json" onchange="loadJSON(event)" />
      </label>

      <button class="btn secondary" onclick="addCountry()">➕ Land</button>
      <button class="btn" onclick="download()">💾 Export</button>

      <div class="country-list" id="countryList"></div>
    </div>

    <!-- MAIN -->
    <div class="container">
      <div class="card" id="editor"></div>
      <div class="card">
        <h3>Json</h3>
        <pre id="jsonPreview"></pre>
      </div>
    </div>

    <script>
      /* ===== TEMPLATE ===== */
      const TEMPLATE = {
        kontinent: "",
        land: { domain: "", flagge: "" },
        verkehr: "",
        plates: [],
        sprache: [],
        googlecar: [],
        bollards: [],
        streets: [],
        poles: [],
        schilder: [],
        taxi: [],
        architcture: [],
      };

      const MEDIA_KEYS = [
        "plates",
        "sprache",
        "googlecar",
        "bollards",
        "streets",
        "poles",
        "schilder",
        "taxi",
        "architcture",
      ];

      let data = {};
      let current = null;

      /* ===== IMPORT ===== */
      function loadJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            data = normalizeAll(parsed);
            current = Object.keys(data)[0];
            renderList();
            renderEditor();

            // ✅ UNIQUE KONTINENTE
            const uniqueKontinente = [
              ...new Set(
                Object.values(data)
                  .map((item) => item.kontinent)
                  .filter((k) => k && k.trim() !== "")
              ),
            ];

            console.log("Unique Kontinente:", uniqueKontinente);
          } catch {
            alert("Ungültige JSON-Datei");
          }
        };
        reader.readAsText(file);
      }

      /* ===== NORMALIZE ===== */
      function normalizeAll(obj) {
        const out = {};
        for (const key in obj) {
          out[key] = normalizeCountry(obj[key]);
        }
        return out;
      }

      function normalizeCountry(c) {
        const result = structuredClone(TEMPLATE);
        result.kontinent = c.kontinent || "";
        result.verkehr = c.verkehr || "";
        result.land = {
          domain: c.land?.domain || "",
          flagge: c.land?.flagge || "",
        };
        MEDIA_KEYS.forEach((k) => {
          result[k] = Array.isArray(c[k]) ? c[k] : [];
        });
        return result;
      }

      /* ===== LIST ===== */
      function renderList() {
        countryList.innerHTML = "";

        Object.keys(data)
          .sort((a, b) => a.localeCompare(b, "de", { sensitivity: "base" }))
          .forEach((c) => {
            const btn = document.createElement("button");
            btn.textContent = c;
            btn.className = "country-tab" + (c === current ? " active" : "");
            btn.onclick = () => {
              current = c;
              renderEditor();
              renderList(); // active-State neu setzen
            };
            countryList.appendChild(btn);
          });
      }

      /* ===== ADD ===== */
      function addCountry() {
        const name = prompt("Name des Landes:");
        if (!name || data[name]) return;
        data[name] = structuredClone(TEMPLATE);
        renderList();
        current = name;
        renderEditor();
      }

      /* ===== EDITOR ===== */
      function renderEditor() {
        if (!current) return;
        const c = data[current];
        editor.innerHTML = `<h2>${current}</h2>`;

        input("kontinent", c);
        input("verkehr", c);

        editor.appendChild(
          section("Land", () => {
            input("domain", c.land, true);
            input("flagge", c.land, true, true);
          })
        );

        MEDIA_KEYS.forEach((key) => {
          editor.appendChild(section(key, () => renderArray(c[key])));
        });

        updatePreview();
      }

      function input(key, obj, nested, isImage) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<label>${key}</label>`;
        const inp = document.createElement("input");
        inp.value = obj[key];
        inp.oninput = (e) => {
          obj[key] = e.target.value;
          updatePreview();
          if (isImage) img.src = obj[key];
        };
        row.appendChild(inp);
        editor.appendChild(row);

        if (isImage) {
          const img = document.createElement("img");
          img.className = "preview-img";
          img.src = obj[key];
          img.onerror = () => (img.src = "");
          editor.appendChild(img);
        }
      }

      function section(title, fn) {
        const fs = document.createElement("fieldset");
        fs.innerHTML = `<legend>${title}</legend>`;
        const div = document.createElement("div");
        fs.appendChild(div);
        const old = editor;
        editor = div;
        fn();
        editor = old;
        return fs;
      }

      function renderArray(arr) {
        arr.forEach((item, i) => {
          const box = document.createElement("div");
          box.className = "array-item";

          ["bild", "beschreibung"].forEach((f) => {
            const row = document.createElement("div");
            row.className = "row";
            row.innerHTML = `<label>${f}</label>`;
            const inp = document.createElement("input");
            inp.value = item[f] || "";
            inp.oninput = (e) => {
              item[f] = e.target.value;
              updatePreview();
              if (f === "bild") img.src = item[f];
            };
            row.appendChild(inp);
            box.appendChild(row);

            if (f === "bild") {
              var img = document.createElement("img");
              img.className = "preview-img";
              img.src = item[f] || "";
              img.onerror = () => (img.src = "");
              box.appendChild(img);
            }
          });

          const del = document.createElement("button");
          del.textContent = "🗑 Entfernen";
          del.onclick = () => {
            arr.splice(i, 1);
            renderEditor();
          };
          box.appendChild(del);
          editor.appendChild(box);
        });

        const add = document.createElement("button");
        add.textContent = "➕ Eintrag hinzufügen";
        add.onclick = () => {
          arr.push({ bild: "", beschreibung: "" });
          renderEditor();
        };
        editor.appendChild(add);
      }

      /* ===== PREVIEW ===== */
      function updatePreview() {
        jsonPreview.textContent = JSON.stringify(data[current], null, 2);
      }

      /* ===== EXPORT ===== */
      function download() {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "data.json"; // nur Name, kein Pfad
        a.click();

        URL.revokeObjectURL(a.href);
      }
    </script>
  </body>
</html>
