<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoGuessr Helfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-2 text-center">
      <div
        class="mb-6 flex flex-col md:flex-row justify-center gap-6 items-center flex-wrap"
      >
        <!-- Filterbereich -->
         <div class="flex flex-col gap-2">
          <p class="font-semibold text-gray-700">Reset:</p>
        <button
          id="resetFilters"
          type="button"
          class="px-3 py-1 border rounded bg-red-100 hover:bg-red-200 transition"
        >
          Reset
        </button>
        </div>
        <!-- Land/Domain -->
        <div class="flex flex-col">
          <label for="land" class="mb-1 font-semibold text-gray-700"
            >Land / Domain:</label
          >
          <input
            id="land"
            type="text"
            oninput="filterLänder()"
            class="px-3 py-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Land/ Domain"
          />
        </div>
        <!-- Kontinent -->
        <div id="kontinent-buttons" class="flex flex-col gap-2">
          <p class="font-semibold text-gray-700">Kontinent:</p>
          <div class="flex flex-wrap gap-2 justify-center">
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Europa"
            >
              Europa
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Nordisch"
            >
              Nordisch
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Kyrillisch"
            >
              Kyrillisch
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Asien"
            >
              Asien
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Afrika"
            >
              Afrika
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Amerika"
            >
              Amerika
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Arabisch"
            >
              Arabisch
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Südamerika"
            >
              Südamerika
            </button>
            <button
              type="button"
              class="kontinent-btn px-3 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-kontinent="Ozeanien"
            >
              Ozeanien
            </button>
          </div>
        </div>
        <!-- Verkehr -->
        <div id="verkehr-buttons" class="flex flex-col gap-2">
          <p class="font-semibold text-gray-700">Verkehr:</p>
          <div class="flex gap-2 justify-center">
            <button
              type="button"
              class="verkehr-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-verkehr="Links"
            >
              Links
            </button>
            <button
              type="button"
              class="verkehr-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-verkehr="Rechts"
            >
              Rechts
            </button>
          </div>
        </div>
        <!-- Plates -->
        <div id="googlecar-buttons" class="flex flex-col gap-2">
          <p class="font-semibold text-gray-700">Plates:</p>
          <div class="flex gap-2 justify-center">
            <button
              type="button"
              class="plates-btn px-4 py-1 border rounded bg-gray-100 hover:bg-gray-200 transition"
              data-plates="Blue"
            >
              White
            </button>
            <button
              type="button"
              class="plates-btn px-4 py-1 border rounded bg-blue-100 hover:bg-blue-200 transition"
              data-plates="Blue"
            >
              Blue
            </button>
            <button
              type="button"
              class="plates-btn px-4 py-1 border rounded bg-green-100 hover:bg-green-200 transition"
              data-plates="Green"
            >
              Green
            </button>
            <button
              type="button"
              class="plates-btn px-4 py-1 border rounded bg-yellow-100 hover:bg-yellow-200 transition"
              data-plates="Yellow"
            >
              Yellow
            </button>
            <button
              type="button"
              class="plates-btn px-4 py-1 border rounded bg-gray-600 hover:bg-gray-900 text-gray-100 transition"
              data-plates="Black"
            >
              Black
            </button>
          </div>
        </div>
        <!-- Googlecar -->
        <div id="googlecar-buttons" class="flex flex-col gap-2">
          <p class="font-semibold text-gray-700">Googlecar:</p>
          <div class="flex gap-2 justify-center">
            <button
              type="button"
              class="googlecar-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-googlecar="Pickup"
            >
              Pickup
            </button>
            <button
              type="button"
              class="googlecar-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-googlecar="Followcar"
            >
              Followcar
            </button>
            <button
              type="button"
              class="googlecar-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-googlecar="Antenna"
            >
              Antenna
            </button>
            <button
              type="button"
              class="googlecar-btn px-4 py-1 border rounded bg-gray-200 hover:bg-blue-200 transition"
              data-googlecar="Mirror"
            >
              Mirror
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabelle -->
    <div class="overflow-x-auto px-2 mb-6">
      <table
        id="countryTable"
        class="min-w-full border border-gray-300 bg-white table-fixed"
      >
        <thead class="bg-gray-200">
          <tr>
            <th class="border px-4 py-2 w-16">Land</th>
            <th class="border px-4 py-2 w-36">Plates</th>
            <th class="border px-4 py-2 w-36">Sprache</th>
            <th class="border px-4 py-2 w-36">Google Car</th>
            <th class="border px-4 py-2 w-36">Bollards</th>
            <th class="border px-4 py-2 w-36">Poles</th>
            <th class="border px-4 py-2 w-36">Schilder</th>
            <th class="border px-4 py-2 w-36">Taxi</th>
            <th class="border px-4 py-2 w-36">Street</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="flex justify-center mt-6">
        <a href="./editor/editor.html">
          <button
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
          >
            Zum Editor
          </button>
        </a>
      </div>
    </div>

    <!-- Modal -->
    <div
      id="imageModal"
      class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50"
    >
      <div
        class="flex flex-col items-center justify-center max-w-full max-h-full px-4"
      >
        <span
          id="closeModal"
          class="absolute top-4 right-6 text-white text-3xl cursor-pointer"
          >&times;</span
        >
<img
  id="modalImage"
  class="max-w-full max-h-[90vh] object-contain transform transition-transform duration-200"
/>
        <div id="caption" class="text-white mt-4 text-center bg-gray-800 text-lg"></div>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
