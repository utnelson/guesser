<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGuessr Helfer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>GeoGuessr Helfer</h1>
        <a href="./editor/editor.html">
    <button>Zum Editor</button>
</a>
    </div>
    <div>
        <!-- Filterbereich -->
        <table id="countryTable">
            <thead>
                <!-- Überschriften -->
                <tr>
                    <th>Land</th>
                    <th>Kontinent</th>
                    <th>Verkehr</th>
                    <th>Plates</th>
                    <th>Sprache</th>
                    <th>Google Car</th>
                    <th>Bollards</th>
                    <th>Poles</th>
                    <th>Schilder</th>
                    <th>Taxi</th>
                </tr>

                <!-- Filterzeile -->
                <tr class="filter-row">
                    <th>
                        <input id="land" oninput="filterLänder()" type="text">
                    </th>
                    <th>
                        <select id="kontinent" onchange="filterLänder()">
                            <option value="">Alle</option>
                            <option value="Arabisch">Arabisch</option>
                            <option value="Afrika">Afrika</option>
                            <option value="Amerika">Amerika</option>
                            <option value="Asien">Asien</option>
                            <option value="Südamerika">Südamerika</option>
                            <option value="Europa">Europa</option>
                            <option value="Kyrillisch">Kyrillisch</option>
                            <option value="Baltisch">Baltisch</option>
                            <option value="Australien">Australien</option>
                        </select>
                    </th>
                    <th>
                        <select id="verkehr" onchange="filterLänder()">
                            <option value="">Alle</option>
                            <option value="Rechts">Rechts</option>
                            <option value="Links">Links</option>
                        </select>
                    </th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Das Modal für vergrößerte Bilder -->
    <div id="imageModal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div id="caption"></div>
    </div>


    <script src="scripts.js"></script>
</body>

</html>
