<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Country Form Editor</title>
  <script src="script.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

  <!-- Topbar -->
  <div class="flex items-center gap-2 p-3 bg-white border-b border-slate-200">
    <label class="px-3 py-2 bg-white border rounded-lg cursor-pointer hover:bg-slate-100">
      📂 Laden
      <input type="file" accept=".json" class="hidden" onchange="loadJSON(event)">
    </label>
    <button class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700" onclick="addCountry()">➕ Land</button>
    <button class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700" onclick="download()">💾 Export</button>

    <!-- Country Select Dropdown -->
    <select id="countrySelect" class="ml-auto px-3 py-2 border rounded-lg" onchange="changeCountry(this.value)">
      <option value="">Land wählen…</option>
    </select>
  </div>

  <!-- Main -->
  <div class="flex-1 grid grid-cols-3 gap-4 p-4 overflow-hidden">

    <!-- Editor: -->
    <div id="editor" class="col-span-3 bg-white border border-slate-200 rounded-xl p-4 overflow-y-auto">
    </div>

  </div>

</body>
</html>
